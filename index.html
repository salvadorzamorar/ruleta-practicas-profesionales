<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universidad SABES Salvatierra - Ruleta de Prácticas</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #07111f, #102b45);
    color: white;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 25px 15px 10px;
}

header h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 900;
    letter-spacing: 2px;
    color: #ffffff;
}

header p {
    margin: 8px 0 0;
    font-size: 18px;
    color: #8fd3ff;
}

.container {
    width: 95%;
    max-width: 1400px;
    margin: auto;
}

.panel {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 20px;
    margin: 20px 0;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.panel h2 {
    margin-top: 0;
    text-align: center;
}

.names-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
}

.names-grid input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 15px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

.btn-load {
    background: #00c853;
    color: white;
}

.btn-clear {
    background: #d50000;
    color: white;
    margin-left: 10px;
}

.btn-spin {
    background: #ff9800;
    color: white;
    font-size: 22px;
    padding: 18px 35px;
    margin-top: 15px;
}

.btn-spin:disabled {
    background: #555;
    cursor: not-allowed;
    transform: none;
}

.btn-next {
    background: #2196f3;
    color: white;
    margin-top: 15px;
}

.status {
    text-align: center;
    margin-top: 15px;
    font-size: 17px;
    color: #b9e7ff;
}

.game {
    display: grid;
    grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr);
    gap: 25px;
    align-items: center;
}

.wheel-container {
    text-align: center;
}

canvas {
    max-width: 100%;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 35px rgba(0,0,0,.45);
}

.result {
    text-align: center;
    min-height: 350px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.selected-label {
    font-size: 18px;
    color: #9edfff;
    margin-bottom: 10px;
}

.student-name {
    font-size: clamp(30px, 5vw, 52px);
    font-weight: 900;
    color: #ffcc00;
    margin: 10px 0 25px;
    text-transform: uppercase;
}

.question {
    font-size: clamp(20px, 2.5vw, 30px);
    line-height: 1.35;
    font-weight: bold;
}

.timer {
    font-size: 45px;
    font-weight: bold;
    margin-top: 20px;
    color: #00e676;
}

.history {
    max-height: 450px;
    overflow-y: auto;
}

.history-item {
    background: rgba(255,255,255,.07);
    border-left: 5px solid #2196f3;
    padding: 14px;
    margin-bottom: 10px;
    border-radius: 8px;
}

.history-student {
    color: #ffcc00;
    font-size: 18px;
    font-weight: bold;
}

.history-question {
    margin-top: 5px;
    line-height: 1.4;
}

.empty {
    text-align: center;
    color: #aaa;
    padding: 20px;
}

.round-message {
    background: rgba(0,200,83,.15);
    border: 1px solid #00c853;
    border-radius: 12px;
    padding: 15px;
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
    display: none;
}

@media(max-width: 900px) {
    .game {
        grid-template-columns: 1fr;
    }

    canvas {
        width: 90vw;
        height: 90vw;
        max-width: 500px;
        max-height: 500px;
    }
}
</style>
</head>

<body>

<header>
    <h1>UNIVERSIDAD SABES SALVATIERRA</h1>
    <p>RUleta de Prácticas Profesionales</p>
</header>

<div class="container">

    <!-- NOMBRES -->
    <section class="panel">
        <h2>👥 CARGA DE ALUMNOS</h2>

        <div class="names-grid" id="namesGrid"></div>

        <div style="text-align:center; margin-top:20px;">
            <button class="btn-load" onclick="loadNames()">
                ✅ CARGAR NOMBRES
            </button>

            <button class="btn-clear" onclick="clearNames()">
                🗑️ LIMPIAR
            </button>
        </div>

        <div class="status" id="status">
            Primero captura los nombres y presiona "Cargar nombres".
        </div>

        <div class="round-message" id="roundMessage"></div>
    </section>

    <!-- JUEGO -->
    <section class="panel">
        <div class="game">

            <div class="wheel-container">

                <canvas id="wheel" width="600" height="600"></canvas>

                <br>

                <button class="btn-spin" id="spinButton"
                        onclick="spinWheel()" disabled>
                    🎡 ¡GIRAR RULETA!
                </button>

            </div>

            <div class="result">

                <div class="selected-label">
                    👤 ALUMNO QUE RESPONDERÁ
                </div>

                <div class="student-name" id="studentName">
                    ---
                </div>

                <div class="question" id="question">
                    Carga los nombres para comenzar.
                </div>

                <div class="timer" id="timer">
                    60
                </div>

                <button class="btn-next" onclick="nextQuestion()">
                    ➡️ SIGUIENTE
                </button>

            </div>

        </div>
    </section>

    <!-- HISTORIAL -->
    <section class="panel">
        <h2>📋 HISTORIAL DE PARTICIPACIÓN</h2>

        <div class="history" id="history">
            <div class="empty">
                Todavía no hay participaciones.
            </div>
        </div>
    </section>

</div>

<script>

const questions = [

"¿Cuál ha sido la experiencia más significativa que has vivido durante tus prácticas profesionales y por qué?",
"¿Cuál ha sido el mayor reto que has enfrentado durante tus prácticas y cómo lo solucionaste?",
"¿Qué actividad realizada durante tus prácticas te hizo darte cuenta de que realmente estás aprendiendo una profesión?",
"¿Qué conocimiento de la universidad has podido aplicar directamente en tus prácticas?",
"¿Qué aprendiste en tus prácticas que no esperabas aprender?",
"¿Cuál ha sido el error que más te ha enseñado durante esta experiencia?",
"¿Qué actividad que al principio parecía difícil ahora puedes realizar con mayor confianza?",
"¿Qué situación de tus prácticas te gustaría volver a vivir porque aprendiste mucho de ella?",
"¿Qué experiencia de tus prácticas contarías cuando alguien te pregunte cómo fue tu primer acercamiento al mundo laboral?",
"Si tuvieras que resumir tus prácticas profesionales en tres palabras, ¿cuáles serían y por qué?",
"¿Qué habilidad descubriste que tienes gracias a tus prácticas?",
"¿Qué aspecto de tu personalidad crees que mejoró durante esta experiencia?",
"¿En qué momento de tus prácticas sentiste que comenzabas a tener mayor confianza en ti mismo(a)?",
"¿Qué actividad te obligó a salir de tu zona de confort?",
"¿Qué debilidad personal identificaste durante tus prácticas y qué estás haciendo para mejorarla?",
"¿Qué aprendiste sobre ti mismo(a) al trabajar con personas diferentes a ti?",
"¿Qué harías diferente si pudieras comenzar nuevamente tus prácticas desde el primer día?",
"¿Qué consejo le darías a tu “yo” del primer día de prácticas?",
"¿Qué habilidad consideras que ahora tienes y que hace unos meses no tenías?",
"¿Crees que después de tus prácticas eres la misma persona que cuando comenzaste? ¿Por qué?",
"Llegas a trabajar y te asignan una actividad que nunca has realizado. ¿Qué haces?",
"Tu supervisor te pide entregar un trabajo en poco tiempo y sabes que probablemente no podrás terminarlo. ¿Cómo actuarías?",
"Cometes un error que puede afectar el trabajo de otras personas. ¿Lo comunicas inmediatamente o intentas solucionarlo primero? ¿Por qué?",
"Tu jefe te hace una observación frente a otros compañeros. ¿Cómo reaccionarías?",
"Te asignan una actividad que consideras aburrida o poco relacionada con tu carrera. ¿Cómo la enfrentarías?",
"Un compañero te pide ayuda cuando tú también tienes mucho trabajo pendiente. ¿Qué haces?",
"Te das cuenta de que no entendiste correctamente las instrucciones de tu supervisor. ¿Qué haces?",
"Te encuentras bajo mucha presión y comienzas a cometer errores. ¿Cómo controlarías la situación?",
"¿Cuál ha sido el momento en tus prácticas en el que más nervios has sentido?",
"¿Qué situación te ha hecho sentir más satisfecho(a) contigo mismo(a) durante tus prácticas?",
"¿Qué característica debe tener un buen compañero de trabajo?",
"¿Qué harías si un compañero no cumple con su parte del trabajo y eso afecta a todo el equipo?",
"¿Cómo reaccionarías si tuvieras un jefe con una personalidad completamente diferente a la tuya?",
"¿Qué harías si no estuvieras de acuerdo con la decisión de tu supervisor?",
"¿Qué es más importante para trabajar en equipo: saber escuchar o saber comunicar? ¿Por qué?",
"¿Cómo manejarías un conflicto con un compañero de trabajo?",
"¿Qué has aprendido de las personas que trabajan contigo?",
"¿Qué comportamiento de un compañero de trabajo consideras poco profesional?",
"¿Qué harías si un compañero se atribuyera como propia una idea que tú propusiste?",
"¿Qué cualidad crees que tus compañeros de prácticas reconocerían en ti?",
"Encuentras información confidencial de la empresa que no deberías estar viendo. ¿Qué haces?",
"Tu supervisor te pide modificar un dato para que un reporte se vea mejor. ¿Cómo responderías?",
"Descubres que un compañero está haciendo algo incorrecto y podría afectar a la empresa. ¿Qué harías?",
"Un compañero te pide tu contraseña para ingresar a un sistema porque dice que tiene mucha prisa. ¿Qué haces?",
"Te das cuenta de que cometiste un error, pero nadie se ha dado cuenta. ¿Lo informas? ¿Por qué?",
"¿Qué significa para ti ser un profesionista responsable?",
"¿Hasta dónde debe llegar la responsabilidad de un practicante dentro de una empresa?",
"Después de esta experiencia, ¿qué habilidad necesitas fortalecer antes de incorporarte completamente al mundo laboral?",
"Si la empresa donde realizaste tus prácticas te ofreciera trabajo, ¿qué factores considerarías antes de aceptar?",
"Completa la frase: “Cuando termine mi carrera quiero que las personas que trabajen conmigo digan que soy un profesionista que…”"

];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const spinButton = document.getElementById("spinButton");
const studentName = document.getElementById("studentName");
const questionBox = document.getElementById("question");
const timerBox = document.getElementById("timer");
const historyBox = document.getElementById("history");
const statusBox = document.getElementById("status");
const roundMessage = document.getElementById("roundMessage");

let names = [];
let availableStudents = [];
let loaded = false;
let spinning = false;
let currentStudent = "";
let currentQuestion = "";
let timerInterval = null;
let timeLeft = 60;
let history = [];

let rotation = 0;


/* CREAR LOS 32 CAMPOS */

const namesGrid = document.getElementById("namesGrid");

for(let i = 1; i <= 32; i++){

    const input = document.createElement("input");

    input.type = "text";
    input.placeholder = "Alumno " + i;
    input.id = "student" + i;

    namesGrid.appendChild(input);
}


/* DIBUJAR RULETA */

function drawWheel(){

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = 280;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const slice = (Math.PI * 2) / questions.length;

    for(let i=0;i<questions.length;i++){

        const start = rotation + i * slice;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,radius,start,end);
        ctx.closePath();

        ctx.fillStyle = `hsl(${i * (360/questions.length)},75%,55%)`;
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    /* CENTRO */

    ctx.beginPath();
    ctx.arc(cx,cy,55,0,Math.PI*2);
    ctx.fillStyle = "#111";
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.fillText("SABES",cx,cy+6);

    /* PUNTERO */

    ctx.beginPath();
    ctx.moveTo(canvas.width - 5, cy - 20);
    ctx.lineTo(canvas.width - 5, cy + 20);
    ctx.lineTo(canvas.width - 45, cy);
    ctx.closePath();

    ctx.fillStyle = "#ffcc00";
    ctx.fill();

}

drawWheel();


/* CARGAR NOMBRES */

function loadNames(){

    names = [];

    for(let i=1;i<=32;i++){

        const value =
            document.getElementById("student"+i).value.trim();

        if(value !== ""){
            names.push(value);
        }

    }

    if(names.length === 0){

        alert("Debes ingresar al menos un nombre.");
        return;

    }

    availableStudents = [...names];

    loaded = true;

    spinButton.disabled = false;

    statusBox.innerHTML =
        `✅ ${names.length} alumno(s) cargado(s). Ya puedes comenzar.`;

    roundMessage.style.display = "none";

    studentName.textContent = "---";

    questionBox.textContent =
        "Presiona “GIRAR RULETA” para comenzar.";

    resetTimer();

}


/* LIMPIAR */

function clearNames(){

    for(let i=1;i<=32;i++){
        document.getElementById("student"+i).value = "";
    }

    names = [];
    availableStudents = [];
    loaded = false;
    spinning = false;

    spinButton.disabled = true;

    studentName.textContent = "---";

    questionBox.textContent =
        "Carga los nombres para comenzar.";

    statusBox.textContent =
        "Primero captura los nombres y presiona \"Cargar nombres\".";

    roundMessage.style.display = "none";

    history = [];

    historyBox.innerHTML =
        '<div class="empty">Todavía no hay participaciones.</div>';

    resetTimer();

}


/* GIRAR RULETA */

function spinWheel(){

    if(!loaded){
        alert("Primero debes cargar los nombres.");
        return;
    }

    if(spinning){
        return;
    }

    if(availableStudents.length === 0){

        roundMessage.style.display = "block";

        roundMessage.innerHTML =
            "🎉 ¡TODOS LOS ALUMNOS HAN PARTICIPADO! Puedes comenzar una nueva ronda.";

        return;

    }

    spinning = true;

    spinButton.disabled = true;

    /* ELEGIR ALUMNO SIN REPETIR */

    const studentIndex =
        Math.floor(Math.random() * availableStudents.length);

    currentStudent =
        availableStudents.splice(studentIndex,1)[0];


    /* ELEGIR PREGUNTA */

    const questionIndex =
        Math.floor(Math.random() * questions.length);

    currentQuestion =
        questions[questionIndex];


    /* ANIMACIÓN */

    const extraSpins =
        5 + Math.floor(Math.random() * 4);

    const targetRotation =
        rotation +
        extraSpins * Math.PI * 2 +
        Math.random() * Math.PI * 2;

    const startRotation = rotation;

    const duration = 4000;

    const startTime = performance.now();


    function animate(time){

        const elapsed = time - startTime;

        const progress =
            Math.min(elapsed / duration,1);

        const ease =
            1 - Math.pow(1-progress,3);

        rotation =
            startRotation +
            (targetRotation-startRotation) * ease;

        drawWheel();

        if(progress < 1){

            requestAnimationFrame(animate);

        }else{

            rotation = targetRotation;

            drawWheel();

            showResult();

        }

    }

    requestAnimationFrame(animate);

}


/* MOSTRAR RESULTADO */

function showResult(){

    spinning = false;

    studentName.textContent =
        currentStudent;

    questionBox.textContent =
        currentQuestion;

    startTimer();

    addHistory();

    if(availableStudents.length === 0){

        setTimeout(()=>{

            roundMessage.style.display = "block";

            roundMessage.innerHTML =
                "🎉 ¡RONDA COMPLETADA! Todos los alumnos han participado.";

        },500);

    }else{

        spinButton.disabled = false;

        statusBox.innerHTML =
            `Participaciones restantes: <strong>${availableStudents.length}</strong>`;

    }

}


/* HISTORIAL */

function addHistory(){

    history.push({

        student: currentStudent,

        question: currentQuestion

    });

    renderHistory();

}


function renderHistory(){

    historyBox.innerHTML = "";

    history.forEach((item,index)=>{

        const div =
            document.createElement("div");

        div.className =
            "history-item";

        div.innerHTML = `

            <div class="history-student">
                ${index+1}. 👤 ${escapeHtml(item.student)}
            </div>

            <div class="history-question">
                ❓ ${escapeHtml(item.question)}
            </div>

        `;

        historyBox.appendChild(div);

    });

}


/* SEGURIDAD PARA HTML */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* TEMPORIZADOR */

function startTimer(){

    clearInterval(timerInterval);

    timeLeft = 60;

    timerBox.textContent = timeLeft;

    timerBox.style.color = "#00e676";

    timerInterval = setInterval(()=>{

        timeLeft--;

        timerBox.textContent =
            timeLeft;

        if(timeLeft <= 10){

            timerBox.style.color =
                "#ff5252";

        }

        if(timeLeft <= 0){

            clearInterval(timerInterval);

            timerBox.textContent =
                "⏰";

        }

    },1000);

}


function resetTimer(){

    clearInterval(timerInterval);

    timeLeft = 60;

    timerBox.textContent = "60";

    timerBox.style.color = "#00e676";

}


/* SIGUIENTE */

function nextQuestion(){

    resetTimer();

    if(loaded && availableStudents.length > 0){

        questionBox.textContent =
            "Presiona “GIRAR RULETA” para seleccionar al siguiente alumno.";

        studentName.textContent =
            "---";

    }

}


/* NUEVA RONDA AUTOMÁTICA */

function newRound(){

    if(!loaded){
        return;
    }

    availableStudents = [...names];

    roundMessage.style.display = "none";

    statusBox.innerHTML =
        `Nueva ronda iniciada. Participarán ${availableStudents.length} alumnos.`;

    studentName.textContent = "---";

    questionBox.textContent =
        "Presiona “GIRAR RULETA” para comenzar.";

    spinButton.disabled = false;

}


/* DOBLE CLICK EN EL MENSAJE PARA NUEVA RONDA */

roundMessage.addEventListener("click",newRound);

</script>

</body>
</html>
